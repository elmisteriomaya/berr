<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Asistencia de Empleados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
<style>
:root{
  --navy:#0B1F3A; --navy-2:#122B4D; --steel:#1F4E79; --accent:#17A5B8; --accent-2:#0B8A7E;
  --bg:#F2F5F8; --card:#FFFFFF; --border:#E1E7EE; --text:#1E293B; --muted:#64748B;
  --danger:#DC2626; --danger-bg:#FEF2F2; --warning:#D97706; --warning-bg:#FFFBEB;
  --success:#16A34A; --success-bg:#F0FDF4; --info-bg:#EFF8FA; --radius:10px;
  --shadow:0 1px 2px rgba(11,31,58,.06), 0 1px 8px rgba(11,31,58,.05);
  --font-sans:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.mono{font-family:var(--font-mono)}
.app{display:flex;min-height:100vh}
#boot{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999;font-size:13px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sidebar{width:236px;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.brand-name{font-weight:800;font-size:15px}
.sidebar nav{padding:12px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#CBD9E8;cursor:pointer;font-size:13.5px;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#7E93AC}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:18px;margin:0;color:var(--navy);font-weight:700}
.db-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--accent-2);background:var(--success-bg);border:1px solid #BFE7CE;padding:5px 10px;border-radius:999px;font-weight:700}
.db-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.content{padding:22px 26px 60px;max-width:1200px;width:100%;margin:0 auto}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:15px;margin:0;color:var(--navy)}
.panel-body{padding:16px 18px}
.grid-2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:960px){.grid-2{grid-template-columns:1fr}}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.form-row .field{flex:1;min-width:150px}
select,input[type=text],input[type=date],input[type=time]{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:13.5px;font-family:inherit}
select:focus,input:focus{outline:2px solid var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
.btn:hover{background:#F8FAFC}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#138E9E}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--border)}
.btn-sm{padding:4px 9px;font-size:12px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
tr.totales td{font-weight:700;background:var(--info-bg)}
.empty{color:var(--muted);font-size:13px;padding:18px 4px;text-align:center}
.badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.badge.activo{background:var(--success-bg);color:var(--success)}
.badge.inactivo{background:var(--danger-bg);color:var(--danger)}
.callout{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--info-bg);padding:11px 14px;border-radius:8px;font-size:13px;color:#0F5B68;margin-bottom:14px}
.readonly-note{background:var(--warning-bg);border:1px solid #F5D9A8;color:#8A5A00;font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:14px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.report-head{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:14px;font-size:13.5px}
.report-head b{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
</style>
</head>
<body>
<div id="boot"><div class="spinner"></div>Inicializando motor de base de datos (SQLite / WebAssembly)…</div>
<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">CA</div><div class="brand-name">Control de Asistencia</div></div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">Universidad Galileo — Bases de Datos<br>Proyecto Final</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="view-title">Departamentos</h1>
      <div class="db-badge"><span class="dot"></span>SQLite embebido</div>
    </div>
    <div class="content" id="view-root"></div>
  </main>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* Control de Asistencia de Empleados — catálogos de Departamentos y
   Empleados en modo SOLO LECTURA (valores estáticos, sin edición),
   sobre una base de datos SQLite real embebida en el navegador. */
const STORAGE_KEY = 'asistencia_v2_readonly';
const TABS = ['departamentos','jornadas','empleados','permisos','marcas','reportes'];
const LABELS = {departamentos:'Departamentos',jornadas:'Jornadas',empleados:'Empleados',permisos:'Permisos',marcas:'Marcar asistencia',reportes:'Reportes'};

const SCHEMA_SQL = `
PRAGMA foreign_keys = ON;
CREATE TABLE departamentos (codigo TEXT PRIMARY KEY, nombre TEXT NOT NULL);
CREATE TABLE jornadas (codigo TEXT PRIMARY KEY, nombre TEXT NOT NULL, hora_entrada TEXT NOT NULL, hora_salida TEXT NOT NULL);
CREATE TABLE empleados (codigo TEXT PRIMARY KEY, nombre TEXT NOT NULL, jornada_codigo TEXT NOT NULL REFERENCES jornadas(codigo), departamento_codigo TEXT NOT NULL REFERENCES departamentos(codigo), estado TEXT NOT NULL DEFAULT 'activo');
CREATE TABLE marcas (id INTEGER PRIMARY KEY AUTOINCREMENT, empleado_codigo TEXT NOT NULL, tipo_marca TEXT NOT NULL, fecha TEXT NOT NULL, hora TEXT NOT NULL, UNIQUE(empleado_codigo,fecha,tipo_marca));
CREATE TABLE permisos (id INTEGER PRIMARY KEY AUTOINCREMENT, empleado_codigo TEXT NOT NULL, fecha TEXT NOT NULL, tipo TEXT NOT NULL, motivo TEXT NOT NULL);
`;

let SQLEngine, db;
function run(sql,p=[]){const s=db.prepare(sql);s.run(p);s.free();persist();}
function all(sql,p=[]){const s=db.prepare(sql);s.bind(p);const o=[];while(s.step())o.push(s.getAsObject());s.free();return o;}
function one(sql,p=[]){const r=all(sql,p);return r.length?r[0]:null;}
function persist(){const d=db.export();let b='';for(let i=0;i<d.length;i++)b+=String.fromCharCode(d[i]);try{localStorage.setItem(STORAGE_KEY,btoa(b));}catch(e){}}
function toMin(hhmm){const[h,m]=hhmm.split(':').map(Number);return h*60+m;}
function fmtHM(m){m=Math.max(0,m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');}

function seed(){
  run(`INSERT INTO departamentos VALUES ('01','Recursos Humanos'),('04','Contabilidad'),('07','Sistemas')`);
  run(`INSERT INTO jornadas VALUES ('D','Diurna','08:00','17:00'),('M','Matutina','07:00','14:00'),('V','Vespertina','14:00','20:00')`);
  run(`INSERT INTO empleados (codigo,nombre,jornada_codigo,departamento_codigo) VALUES ('010','Juan Pérez','D','04'),('011','María López','M','01'),('012','Carlos Ruiz','V','07')`);
  const m=[['010','2021-09-03','entrada','07:58'],['010','2021-09-03','salida','17:10'],['010','2021-09-04','entrada','08:15'],['010','2021-09-04','salida','17:00'],
    ['010','2021-09-05','salida','16:59'],['010','2021-09-06','entrada','07:45'],['010','2021-09-06','salida','17:10'],['010','2021-09-07','entrada','08:00'],['010','2021-09-07','salida','17:05']];
  m.forEach(x=>run('INSERT INTO marcas (empleado_codigo,fecha,tipo_marca,hora) VALUES (?,?,?,?)',x));
  run(`INSERT INTO permisos (empleado_codigo,fecha,tipo,motivo) VALUES ('010','2021-09-05','otro','Olvido marcar')`);
}
async function initDb(){
  SQLEngine = await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/'+f});
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){ db = new SQLEngine.Database(Uint8Array.from(atob(saved),c=>c.charCodeAt(0))); }
  else { db = new SQLEngine.Database(); db.run(SCHEMA_SQL); seed(); persist(); }
}

const Biz = {
  departamentos(){ return all('SELECT * FROM departamentos ORDER BY codigo'); },
  jornadas(){ return all('SELECT * FROM jornadas ORDER BY codigo'); },
  empleados(){ return all(`SELECT e.*, j.nombre jn, d.nombre dn FROM empleados e JOIN jornadas j ON j.codigo=e.jornada_codigo JOIN departamentos d ON d.codigo=e.departamento_codigo ORDER BY e.codigo`); },
  permisos(){ return all(`SELECT p.*, e.nombre en FROM permisos p JOIN empleados e ON e.codigo=p.empleado_codigo ORDER BY p.fecha DESC`); },
  crearPermiso(ec,fecha,tipo,motivo){ run('INSERT INTO permisos (empleado_codigo,fecha,tipo,motivo) VALUES (?,?,?,?)',[ec,fecha,tipo,motivo]); },
  marcar(ec,tipo){
    const e=one('SELECT * FROM empleados WHERE codigo=?',[ec]);
    if(!e) return {ok:false,reason:'Código de empleado no existe'};
    if(e.estado!=='activo') return {ok:false,reason:'Empleado inactivo'};
    const now=new Date(), fecha=now.toISOString().slice(0,10), hora=now.toTimeString().slice(0,5);
    if(one('SELECT id FROM marcas WHERE empleado_codigo=? AND fecha=? AND tipo_marca=?',[ec,fecha,tipo]))
      return {ok:false,reason:`Ya existe una marca de ${tipo} hoy`};
    run('INSERT INTO marcas (empleado_codigo,fecha,tipo_marca,hora) VALUES (?,?,?,?)',[ec,fecha,tipo,hora]);
    return {ok:true,hora};
  },
  marcasRecientes(n){ return all(`SELECT m.*, e.nombre en FROM marcas m JOIN empleados e ON e.codigo=m.empleado_codigo ORDER BY m.id DESC LIMIT ?`,[n]); },
  reporte(ec,desde,hasta){
    const e=one(`SELECT e.*, j.nombre jn, j.hora_entrada, j.hora_salida, d.nombre dn FROM empleados e JOIN jornadas j ON j.codigo=e.jornada_codigo JOIN departamentos d ON d.codigo=e.departamento_codigo WHERE e.codigo=?`,[ec]);
    if(!e) return null;
    const dias=[]; let cur=new Date(desde+'T00:00:00'); const fin=new Date(hasta+'T00:00:00'); let tT=0,tE=0;
    while(cur<=fin){
      const fecha=cur.toISOString().slice(0,10);
      const en=one('SELECT hora FROM marcas WHERE empleado_codigo=? AND fecha=? AND tipo_marca="entrada"',[ec,fecha]);
      const sa=one('SELECT hora FROM marcas WHERE empleado_codigo=? AND fecha=? AND tipo_marca="salida"',[ec,fecha]);
      const pe=one('SELECT motivo FROM permisos WHERE empleado_codigo=? AND fecha=?',[ec,fecha]);
      let mt=0,me=0,hs='*';
      if(en){const d=toMin(en.hora)-toMin(e.hora_entrada); if(d>0)mt=d;}
      if(sa){const d=toMin(e.hora_salida)-toMin(sa.hora); if(d>0)me=d;}
      if(en&&sa) hs=fmtHM(toMin(sa.hora)-toMin(en.hora)-60);
      tT+=mt;tE+=me;
      dias.push({fecha,entrada:en?en.hora:'*',salida:sa?sa.hora:'*',mt,me,hs,obs:pe?pe.motivo:''});
      cur.setDate(cur.getDate()+1);
    }
    return {e,dias,tT,tE};
  },
};

const App = { tab:'departamentos',
  toast(m){ const w=document.getElementById('toastWrap'); const t=document.createElement('div'); t.className='toast'; t.textContent=m; w.appendChild(t); setTimeout(()=>t.remove(),2600); },
  buildNav(){ const nav=document.getElementById('nav'); nav.innerHTML=''; TABS.forEach(t=>{ const b=document.createElement('button'); b.className='nav-item'+(t===this.tab?' active':''); b.textContent=LABELS[t]; b.onclick=()=>{this.tab=t;this.render();}; nav.appendChild(b); }); },
  render(){ this.buildNav(); document.getElementById('view-title').textContent=LABELS[this.tab]; document.getElementById('view-root').innerHTML=Views[this.tab](); if(this.tab==='marcas')Views.afterMarcas(); },
};

function opts(list,vk,fn){ return list.map(x=>`<option value="${x[vk]}">${fn(x)}</option>`).join(''); }

const Views = {
  departamentos(){
    const rows=Biz.departamentos();
    return `<div class="readonly-note">Catálogo estático — valores fijos del enunciado, sin opción de alta/edición/baja desde la aplicación.</div>
    <div class="panel"><div class="panel-head"><h2>Departamentos</h2></div><div class="panel-body">
    <table><tr><th>Código</th><th>Nombre</th></tr>
    ${rows.map(r=>`<tr><td class="mono">${r.codigo}</td><td>${r.nombre}</td></tr>`).join('')}
    </table></div></div>`;
  },
  jornadas(){
    const rows=Biz.jornadas();
    return `<div class="panel"><div class="panel-head"><h2>Jornadas laborales</h2></div><div class="panel-body">
    <table><tr><th>Código</th><th>Nombre</th><th>Entrada</th><th>Salida</th></tr>
    ${rows.map(r=>`<tr><td class="mono">${r.codigo}</td><td>${r.nombre}</td><td class="mono">${r.hora_entrada}</td><td class="mono">${r.hora_salida}</td></tr>`).join('')}
    </table></div></div>`;
  },
  empleados(){
    const rows=Biz.empleados();
    return `<div class="readonly-note">Catálogo estático — valores fijos del enunciado, sin opción de alta/edición/baja desde la aplicación.</div>
    <div class="panel"><div class="panel-head"><h2>Empleados</h2></div><div class="panel-body">
    <table><tr><th>Código</th><th>Nombre</th><th>Jornada</th><th>Departamento</th><th>Estado</th></tr>
    ${rows.map(r=>`<tr><td class="mono">${r.codigo}</td><td>${r.nombre}</td><td>${r.jn}</td><td>${r.dn}</td><td><span class="badge ${r.estado}">${r.estado}</span></td></tr>`).join('')}
    </table></div></div>`;
  },
  permisos(){
    const rows=Biz.permisos(), emps=Biz.empleados();
    return `<div class="grid-2">
      <div class="panel"><div class="panel-head"><h2>Nuevo permiso</h2></div><div class="panel-body">
        <div class="field"><label>Empleado</label><select id="p-emp">${opts(emps,'codigo',e=>e.codigo+' - '+e.nombre)}</select></div>
        <div class="form-row"><div class="field"><label>Fecha</label><input type="date" id="p-fecha"></div>
        <div class="field"><label>Tipo</label><select id="p-tipo"><option value="ausencia">Ausencia</option><option value="llegada_tarde">Llegada tarde</option><option value="salida_temprano">Salida temprano</option><option value="otro">Otro</option></select></div></div>
        <div class="field"><label>Motivo</label><input type="text" id="p-motivo"></div>
        <button class="btn btn-primary" onclick="Views.crearPermiso()">Guardar</button>
      </div></div>
      <div class="panel"><div class="panel-head"><h2>Permisos (${rows.length})</h2></div><div class="panel-body">
      <table><tr><th>Fecha</th><th>Empleado</th><th>Tipo</th><th>Motivo</th></tr>
      ${rows.length?rows.map(r=>`<tr><td class="mono">${r.fecha}</td><td>${r.en}</td><td>${r.tipo}</td><td>${r.motivo}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Sin permisos</td></tr>'}
      </table></div></div>
    </div>`;
  },
  crearPermiso(){
    const ec=document.getElementById('p-emp').value, fecha=document.getElementById('p-fecha').value, tipo=document.getElementById('p-tipo').value, motivo=document.getElementById('p-motivo').value.trim();
    if(!fecha||!motivo) return App.toast('Completa fecha y motivo');
    Biz.crearPermiso(ec,fecha,tipo,motivo); App.toast('Permiso registrado'); App.render();
  },
  marcas(){
    const emps=Biz.empleados().filter(e=>e.estado==='activo'), rec=Biz.marcasRecientes(10);
    return `<div class="callout">Se guarda &lt;codigo_empleado, tipo_marca, fecha, hora&gt; con la hora del momento del registro.</div>
    <div class="grid-2">
      <div class="panel"><div class="panel-head"><h2>Registrar marca</h2></div><div class="panel-body">
        <div class="field"><label>Código de empleado</label><input type="text" id="m-codigo" class="mono" list="lista-emp"></div>
        <datalist id="lista-emp">${emps.map(e=>`<option value="${e.codigo}">${e.nombre}</option>`).join('')}</datalist>
        <div class="form-row"><button class="btn btn-primary" onclick="Views.marcar('entrada')">Marcar entrada</button><button class="btn" onclick="Views.marcar('salida')">Marcar salida</button></div>
      </div></div>
      <div class="panel"><div class="panel-head"><h2>Marcas recientes</h2></div><div class="panel-body">
      <table><tr><th>Empleado</th><th>Tipo</th><th>Fecha</th><th>Hora</th></tr>
      ${rec.length?rec.map(r=>`<tr><td>${r.en}</td><td>${r.tipo_marca}</td><td class="mono">${r.fecha}</td><td class="mono">${r.hora}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Sin marcas</td></tr>'}
      </table></div></div>
    </div>`;
  },
  afterMarcas(){ const i=document.getElementById('m-codigo'); if(i){ i.addEventListener('keydown',e=>{if(e.key==='Enter')Views.marcar('entrada');}); i.focus(); } },
  marcar(tipo){
    const c=document.getElementById('m-codigo').value.trim(); if(!c) return;
    const r=Biz.marcar(c,tipo); App.toast(r.ok?`${tipo} registrada — ${r.hora}`:r.reason);
    if(r.ok) document.getElementById('m-codigo').value='';
    App.render();
  },
  reportes(){
    const emps=Biz.empleados();
    return `<div class="panel"><div class="panel-head"><h2>Reporte de entradas tarde y salidas temprano</h2></div><div class="panel-body">
      <div class="form-row">
        <div class="field"><label>Empleado</label><select id="r-emp">${opts(emps,'codigo',e=>e.codigo+' - '+e.nombre)}</select></div>
        <div class="field"><label>Desde</label><input type="date" id="r-desde" value="2021-09-03"></div>
        <div class="field"><label>Hasta</label><input type="date" id="r-hasta" value="2021-09-07"></div>
        <div class="field" style="display:flex;align-items:flex-end;"><button class="btn btn-primary" onclick="Views.generar()">Generar</button></div>
      </div></div></div><div id="r-result"></div>`;
  },
  generar(){
    const ec=document.getElementById('r-emp').value, d=document.getElementById('r-desde').value, h=document.getElementById('r-hasta').value;
    const rep=Biz.reporte(ec,d,h), box=document.getElementById('r-result');
    if(!rep){ box.innerHTML='<div class="panel"><div class="panel-body"><p class="empty">No encontrado.</p></div></div>'; return; }
    box.innerHTML=`<div class="panel"><div class="panel-head"><h2>Del ${d} al ${h}</h2></div><div class="panel-body">
      <div class="report-head"><div><b>Empleado</b>${rep.e.codigo} - ${rep.e.nombre}</div><div><b>Departamento</b>${rep.e.departamento_codigo} - ${rep.e.dn}</div><div><b>Jornada</b>${rep.e.jn} de ${rep.e.hora_entrada} a ${rep.e.hora_salida}</div></div>
      <table><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Tarde(min)</th><th>Temprano(min)</th><th>Horas</th><th>Observaciones</th></tr>
      ${rep.dias.map(d=>`<tr><td class="mono">${d.fecha}</td><td class="mono">${d.entrada}</td><td class="mono">${d.salida}</td><td class="mono">${d.mt}</td><td class="mono">${d.me}</td><td class="mono">${d.hs}</td><td>${d.obs}</td></tr>`).join('')}
      <tr class="totales"><td colspan="3">Totales</td><td class="mono">${rep.tT}</td><td class="mono">${rep.tE}</td><td></td><td></td></tr>
      </table></div></div>`;
  },
};

(async function boot(){
  try{
    await initDb();
    document.getElementById('boot').style.display='none';
    document.getElementById('app').style.display='flex';
    App.render();
  }catch(err){
    document.getElementById('boot').textContent = 'No se pudo cargar sql.js. Verifica tu conexión. '+err.message;
  }
})();
</script>
</body>
</html>
